name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download && go mod verify

      - name: Lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2

      - name: Test with coverage
        run: |
          go test -tags signing ./... \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=120s

      - name: Check coverage thresholds
        run: |
          go tool cover -func=coverage.out | tee /tmp/coverage.txt
          # Fail if total coverage drops below 95%
          TOTAL=$(grep "^total:" /tmp/coverage.txt | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          awk "BEGIN { exit (${TOTAL} < 95) ? 1 : 0 }" || \
            (echo "Coverage ${TOTAL}% is below 95% threshold" && exit 1)

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Build server image
        run: |
          docker build \
            --build-arg GO_BUILD_IMAGE=golang:1.26-alpine \
            -f deploy/server/Dockerfile \
            -t gov-jwks-service:${{ github.sha }} .

      - name: Build rotator image
        run: |
          docker build \
            --build-arg GO_BUILD_IMAGE=golang:1.26-alpine \
            -f deploy/rotator/Dockerfile \
            -t jwks-rotator:${{ github.sha }} .

  helm:
    name: Helm chart lint & unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v4.2.2

      - name: Install helm-unittest plugin
        # --verify=false: helm v4 verifies plugin signatures by default;
        # helm-unittest is not signed, so verification has to be skipped.
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --version v0.7.0 --verify=false

      - name: helm lint
        run: helm lint charts/gov-jwks-service --strict

      - name: helm template (default values)
        run: helm template ci-default charts/gov-jwks-service --namespace platform > /tmp/default.yaml

      - name: helm template (trusted CAs + monitoring enabled)
        run: |
          cat > /tmp/values-full.yaml <<'YAML'
          monitoring:
            serviceMonitor:
              enabled: true
            prometheusRule:
              enabled: true
          trustedCAs:
            bundles:
              vault-ca: |
                -----BEGIN CERTIFICATE-----
                MIIBkTCB+w==
                -----END CERTIFICATE-----
          YAML
          helm template ci-full charts/gov-jwks-service \
            --namespace platform \
            --values /tmp/values-full.yaml > /tmp/full.yaml

      - name: helm unittest
        run: helm unittest charts/gov-jwks-service --strict

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rendered-manifests
          path: /tmp/*.yaml
