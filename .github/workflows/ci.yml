name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download && go mod verify

#      - name: Lint
#        uses: golangci/golangci-lint-action@v9
#        with:
#          version: latest
#          args: --timeout=5m

      - name: Test with coverage
        run: |
          go test -tags signing ./... \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -timeout=120s

      - name: Check coverage thresholds
        run: |
          go tool cover -func=coverage.out | tee /tmp/coverage.txt
          # Fail if total coverage drops below 95%
          TOTAL=$(grep "^total:" /tmp/coverage.txt | awk '{print $3}' | tr -d '%')
          echo "Total coverage: ${TOTAL}%"
          awk "BEGIN { exit (${TOTAL} < 95) ? 1 : 0 }" || \
            (echo "Coverage ${TOTAL}% is below 95% threshold" && exit 1)

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Build server image
        run: |
          docker build \
            --build-arg GO_BUILD_IMAGE=golang:1.26-alpine \
            -f deploy/server/Dockerfile \
            -t jwks-service:${{ github.sha }} .

      - name: Build rotator image
        run: |
          docker build \
            --build-arg GO_BUILD_IMAGE=golang:1.26-alpine \
            -f deploy/rotator/Dockerfile \
            -t jwks-rotator:${{ github.sha }} .
