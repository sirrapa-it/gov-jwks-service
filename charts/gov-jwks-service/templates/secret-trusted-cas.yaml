{{- if and .Values.trustedCAs.bundles (not .Values.trustedCAs.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gov-jwks-service.trustedCAsSecretName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "gov-jwks-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- range $name, $pem := .Values.trustedCAs.bundles }}
  {{ $name }}.crt: |
{{ $pem | indent 4 }}
  {{- end }}
{{- end }}
