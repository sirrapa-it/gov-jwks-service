suite: rotator bootstrap Job
templates:
  - job-bootstrap.yaml
release:
  name: jwks
  namespace: platform
tests:
  - it: renders by default
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Job }
      - equal:
          path: metadata.name
          value: jwks-gov-jwks-service-rotator-bootstrap

  - it: is suppressed when bootstrap.enabled=false
    set:
      rotator.bootstrap.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: registers as a pre-install Helm hook
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation,hook-succeeded

  - it: tags the pod with role=bootstrap
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/role"]
          value: bootstrap
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/role"]
          value: bootstrap

  - it: applies backoffLimit and deadline from values
    set:
      rotator.bootstrap.backoffLimit: 2
      rotator.bootstrap.activeDeadlineSeconds: 240
    asserts:
      - equal:
          path: spec.backoffLimit
          value: 2
      - equal:
          path: spec.activeDeadlineSeconds
          value: 240

  - it: uses the rotator image and rotator Vault role
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].image
          pattern: "ghcr.io/sirrapa-it/gov-jwks-rotator:.+"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VAULT_K8S_ROLE
            value: "jwks-rotator"

  - it: pod has restartPolicy OnFailure
    asserts:
      - equal:
          path: spec.template.spec.restartPolicy
          value: OnFailure

  - it: mounts trusted-cas Secret when bundles are configured
    set:
      trustedCAs.bundles:
        ca: |
          -----BEGIN CERTIFICATE-----
          MIIBkTCB+w==
          -----END CERTIFICATE-----
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SSL_CERT_DIR
            value: "/etc/ssl/jwks-service-cas"
      - contains:
          path: spec.template.spec.volumes
          content:
            name: trusted-cas
            secret:
              secretName: jwks-gov-jwks-service-trusted-cas
