suite: trusted-CAs Secret
templates:
  - secret-trusted-cas.yaml
release:
  name: jwks
  namespace: platform
tests:
  - it: does not render when no CAs are configured
    asserts:
      - hasDocuments: { count: 0 }

  - it: does not render when only existingSecret is set
    set:
      trustedCAs.existingSecret: external-cas
    asserts:
      - hasDocuments: { count: 0 }

  - it: does not render when existingSecret takes precedence over bundles
    set:
      trustedCAs.existingSecret: external-cas
      trustedCAs.bundles:
        vault-ca: |
          -----BEGIN CERTIFICATE-----
          MIIBkTCB+w==
          -----END CERTIFICATE-----
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders one Opaque Secret with each bundle as <name>.crt
    set:
      trustedCAs.bundles:
        vault-ca: |
          -----BEGIN CERTIFICATE-----
          AAAAAA==
          -----END CERTIFICATE-----
        sirrapa-root: |
          -----BEGIN CERTIFICATE-----
          BBBBBB==
          -----END CERTIFICATE-----
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Secret }
      - equal:
          path: type
          value: Opaque
      - equal:
          path: metadata.name
          value: jwks-gov-jwks-service-trusted-cas
      - exists:
          path: stringData["vault-ca.crt"]
      - exists:
          path: stringData["sirrapa-root.crt"]
      - matchRegex:
          path: stringData["vault-ca.crt"]
          pattern: "BEGIN CERTIFICATE"

  - it: registers as a pre-install / pre-upgrade hook so it lands before the bootstrap Job
    set:
      trustedCAs.bundles:
        ca: |
          -----BEGIN CERTIFICATE-----
          AAAAAA==
          -----END CERTIFICATE-----
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-15"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation
