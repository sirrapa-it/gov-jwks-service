suite: server Service
templates:
  - service.yaml
release:
  name: jwks
  namespace: platform
tests:
  - it: renders by default
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: Service }
      - equal:
          path: metadata.name
          value: jwks-gov-jwks-service-server

  - it: is suppressed when server.enabled=false
    set:
      server.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: defaults to ClusterIP on port 80 → 8080
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: 8080
      - equal:
          path: spec.ports[0].name
          value: http
      - equal:
          path: spec.ports[0].protocol
          value: TCP

  - it: selects only the server pods
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: server
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: gov-jwks-service

  - it: honours service.type and ports overrides
    set:
      server.service.type: NodePort
      server.service.port: 8443
      server.service.targetPort: 9443
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].port
          value: 8443
      - equal:
          path: spec.ports[0].targetPort
          value: 9443

  - it: applies service annotations
    set:
      server.service.annotations:
        cloud.example/lb: "internal"
    asserts:
      - equal:
          path: metadata.annotations["cloud.example/lb"]
          value: internal
