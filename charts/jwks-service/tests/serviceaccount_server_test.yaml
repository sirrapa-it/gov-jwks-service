suite: server ServiceAccount
templates:
  - serviceaccount-server.yaml
release:
  name: jwks
  namespace: platform
tests:
  - it: renders by default
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: ServiceAccount }
      - equal:
          path: metadata.name
          value: jwks-jwks-service-server
      - equal:
          path: metadata.namespace
          value: platform
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: is suppressed when server.enabled=false
    set:
      server.enabled: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: is suppressed when create=false
    set:
      server.serviceAccount.create: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: honours a custom name
    set:
      server.serviceAccount.name: external-sa
    asserts:
      - equal:
          path: metadata.name
          value: external-sa

  - it: applies annotations
    set:
      server.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::1234:role/r
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::1234:role/r
