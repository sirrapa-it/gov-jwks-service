suite: rotator ServiceAccount
templates:
  - serviceaccount-rotator.yaml
release:
  name: jwks
  namespace: platform
tests:
  - it: renders by default
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: ServiceAccount }
      - equal:
          path: metadata.name
          value: jwks-jwks-service-rotator
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: is suppressed when create=false
    set:
      rotator.serviceAccount.create: false
    asserts:
      - hasDocuments: { count: 0 }

  - it: carries pre-install hook annotations when bootstrap is enabled
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"
      - equal:
          path: metadata.annotations["helm.sh/hook-delete-policy"]
          value: before-hook-creation

  - it: omits hook annotations when bootstrap is disabled
    set:
      rotator.bootstrap.enabled: false
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: honours a custom name
    set:
      rotator.serviceAccount.name: custom-rotator
    asserts:
      - equal:
          path: metadata.name
          value: custom-rotator
